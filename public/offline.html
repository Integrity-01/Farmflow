<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#16a34a" />
    <title>FarmFlow — You're offline</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: #f8fafc;
        color: #1e293b;
      }
      .card {
        text-align: center;
        padding: 40px 24px;
        max-width: 380px;
      }
      .logo {
        width: 72px;
        height: 72px;
        border-radius: 20px;
        background: #16a34a;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 34px;
        color: #fff;
        margin-bottom: 20px;
      }
      h1 { font-size: 22px; margin: 0 0 8px; }
      p { font-size: 15px; color: #475569; line-height: 1.5; margin: 0 0 24px; }
      button {
        font-size: 15px;
        font-weight: 600;
        color: #fff;
        background: #16a34a;
        border: 0;
        border-radius: 10px;
        padding: 12px 22px;
        cursor: pointer;
      }
      button:hover { background: #15803d; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="logo">🌱</div>
      <h1>You're offline</h1>
      <p>FarmFlow saved your recent tasks so you can keep working. Changes will sync automatically when your connection returns.</p>
      <button onclick="window.location.reload()">Try again</button>
    </div>
  </body>
</html>
