# FarmFlow web server. Serves the built PWA and proxies /api + /uploads to the
# API container. Same-origin access means no CORS is needed for the browser.
server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;
  gzip_min_length 1024;

  # Hashed build assets are immutable once published.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # App shell must never be cached long-term (stale index.html breaks PWA updates).
  location = /index.html {
    add_header Cache-Control "no-store";
  }
  location = /sw.js {
    add_header Cache-Control "no-store";
  }
  location = /manifest.webmanifest {
    add_header Cache-Control "no-store";
    default_type application/manifest+json;
  }

  # API + uploaded files -> Express container.
  location /api/ {
    proxy_pass http://api:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    client_max_body_size 16m;
  }
  location /uploads/ {
    proxy_pass http://api:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # SPA fallback: unknown client paths -> index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }
}